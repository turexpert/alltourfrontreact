<div class="header">
  <div class="container">
    <nav class="navbar">
      <div class="nav-container">
        <button class="nav-toggle" [class.opened]="isOpen" (click)="toggleMenu()">
          <span class="bar-top"></span>
          <span class="bar-mid"></span>
          <span class="bar-bot"></span>
        </button>
      </div>

      <div>
        <a [routerLink]="['/']" class="logo">
          <img src="assets/images/logo.svg" alt="Alltour" class="logo-image">
        </a>
      </div>
      <div class="nav-actions">
        <button class="btn-icon" (click)="openDialog()">
          <i class="icon icon-account"></i>
        </button>
        <button [cdkMenuTriggerFor]="phoneList" class="btn-icon">
          <i class="icon icon-phone"></i>
        </button>
        <ng-template #phoneList>
          <div class="phone-list-menu" cdkMenu>
            <div cdkMenuItem>
              <p>ТЦ Замок</p>
              <a href="tel:+375293778080">
                <i class="icon icon-phone"></i>
                +375 29 377 80 80
              </a>
            </div>
            <div cdkMenuItem>
              <p>ТЦ Момо</p>
              <a href="tel:+375293048080">
                <i class="icon icon-phone"></i>
                +375 29 304 80 80
              </a>
            </div>
          </div>
        </ng-template>

      </div>
    </nav>
  </div>
</div>
<div class="nav-menu-container">
  <div [ngClass]="{'visible': isOpen}" class="menu-overlay" [class.open]="isOpen" (click)="toggleMenu()"></div>
  <div class="mobile-menu" [@openClose]="isOpen ? 'open' : 'closed'">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" routerLink="/news">Поиск тура</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/news">Акции и новости</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/blog">Блог</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/about">О нас</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/contacts">Контакты</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/mice">Вопрос-ответ</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/clients">Корпоративным клиентам</a>
      </li>
    </ul>
  </div>
</div>
