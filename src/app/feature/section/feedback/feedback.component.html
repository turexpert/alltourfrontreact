<div class="bg-gray">
  <app-section-wrapper>
    <ng-container title>
      <h2>Что о нас думают клиенты</h2>
    </ng-container>
    <ng-container actions>
      <div class="action">
        <div class="carousel-nav">
          @if(feedbackCarousel) {
          <button class="btn btn-round" (click)="feedbackCarousel.prev()"
            [disabled]="feedbackCarousel.navData.prev.disabled"><span class="icon icon-arrow_left_big"></span></button>
          <button class="btn btn-round" (click)="feedbackCarousel.next()"
            [disabled]="feedbackCarousel.navData.next.disabled"><span class="icon icon-arrow_right_big"></span></button>
          }
        </div>
      </div>
    </ng-container>
    <ng-container content>
      <div class="feedback-cards">
        @defer {
        <owl-carousel-o #feedbackCarousel [options]="carouselOptions" (initialized)="initCarousel()" (changed)="initCarousel()">

          @for (feed of feedback; track feed; let idx = $index) {
          <ng-template carouselSlide>
            <div class="feedback-card">
              <div class="feedback-card__content">
                <span class="icon icon-quote"></span>
                <h4 class="feedback-card__title">{{feed.title}}</h4>
                <div class="feedback-card__description">{{feed.description}}</div>
              </div>
              <div class="feedback-card__actions">
                <div class="feedback-card__person">
                  <div class="feedback-card__avatar">
                    <img src="{{feed.avatar}}" alt="{{feed.name}}">
                  </div>
                  <div class="feedback-card__info">
                    <div class="feedback-card__name">{{feed.name}}</div>
                    <div class="feedback-card__additional-info">{{feed.info}}</div>
                  </div>
                </div>
                <div class="feedback-card__button"><button class="btn btn-secondary">Смотреть отзыв</button></div>
              </div>
            </div>
          </ng-template>
          }
        </owl-carousel-o>
        }
      </div>

    </ng-container>
  </app-section-wrapper>
</div>
