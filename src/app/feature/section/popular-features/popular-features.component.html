<app-section-wrapper>
  <ng-container title>
    <h2>Популярные разделы и услуги</h2>
  </ng-container>
  <ng-container content>
    <div class="popular-features">
      <owl-carousel-o [options]="customOptions">
        <ng-container *ngFor="let item of items">
          <ng-template carouselSlide [id]="item.id">
            <div class="popular-features__navigate">
              <span class="{{ item.class }}"></span>
              <span>{{ item.title }}</span>
            </div>
          </ng-template>
        </ng-container>
      </owl-carousel-o>
    </div>
  </ng-container>
</app-section-wrapper>
